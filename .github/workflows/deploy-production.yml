name: Deploy Production

on:
  push:
    branches:
      - production

env:
  AWS_REGION: ap-south-1
  AWS_DEFAULT_REGION: ap-south-1

jobs:
  build:
    name: Build & Test (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build:open-next

      - name: Archive OpenNext bundle
        run: tar -C .open-next -czf open-next.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-open-next
          path: open-next.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET_PROD }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-open-next
          path: .

      - name: Extract build artifact
        run: |
          rm -rf .open-next
          mkdir -p .open-next
          tar -xzf open-next.tar.gz -C .open-next

      - name: Sync assets to S3
        run: |
          aws s3 sync ./.open-next/assets s3://$S3_BUCKET --delete

      - name: Update Lambda function
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME_PRODUCTION }}
        run: |
          rm -f server-function.zip
          pushd .open-next/server-functions/default >/dev/null
          zip -qr ../../../server-function.zip .
          popd >/dev/null
          aws s3 cp server-function.zip s3://$S3_BUCKET/lambda/server-function.zip --region "$AWS_REGION"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$S3_BUCKET" \
            --s3-key lambda/server-function.zip

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment to production completed with status: ${{ job.status }}"
