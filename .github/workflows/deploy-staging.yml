name: Deploy Staging

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  NODE_VERSION: 20
  PNPM_VERSION: 9

jobs:
  build:
    name: Build & Package (Staging)
    runs-on: ubuntu-latest

    # Env vars visible to the build (Next.js / OpenNext)
    env:
      NEXT_PUBLIC_API_BASE: ${{ secrets.STAGING_NEXT_PUBLIC_API_BASE }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SITE_URL }}
      API_RATE_LIMIT_MAX: ${{ secrets.STAGING_API_RATE_LIMIT_MAX }}
      API_RATE_LIMIT_WINDOW_MS: ${{ secrets.STAGING_API_RATE_LIMIT_WINDOW_MS }}
      CSRF_COOKIE_NAME: ${{ secrets.STAGING_CSRF_COOKIE_NAME }}
      AUTH_SESSION_COOKIE_NAME: ${{ secrets.STAGING_AUTH_SESSION_COOKIE_NAME }}
      REDUX_DEVTOOLS_ENABLED: ${{ secrets.STAGING_REDUX_DEVTOOLS_ENABLED }}
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Next.js build output
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenNext project
        env:
          NODE_ENV: production
        run: pnpm run build:open-next

      - name: Archive OpenNext bundle
        run: |
          tar -C .open-next -czf open-next.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-open-next
          path: open-next.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging

    env:
      AWS_REGION: ap-south-1
      # MUST be just the bucket name (no s3://, no path)
      S3_BUCKET: ${{ secrets.S3_BUCKET_STAGING }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_STAGING }}
      # you can keep this literal or move to a secret if you prefer
      LAMBDA_FUNCTION_NAME: asharvi-ssr-stag
      LAMBDA_S3_KEY: lambda/server-function.zip
      NEXT_PUBLIC_API_BASE: ${{ secrets.STAGING_NEXT_PUBLIC_API_BASE }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SITE_URL }}
      API_RATE_LIMIT_MAX: ${{ secrets.STAGING_API_RATE_LIMIT_MAX }}
      API_RATE_LIMIT_WINDOW_MS: ${{ secrets.STAGING_API_RATE_LIMIT_WINDOW_MS }}
      CSRF_COOKIE_NAME: ${{ secrets.STAGING_CSRF_COOKIE_NAME }}
      AUTH_SESSION_COOKIE_NAME: ${{ secrets.STAGING_AUTH_SESSION_COOKIE_NAME }}
      REDUX_DEVTOOLS_ENABLED: ${{ secrets.STAGING_REDUX_DEVTOOLS_ENABLED }}
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-open-next
          path: .

      - name: Extract OpenNext bundle
        run: |
          rm -rf .open-next
          mkdir -p .open-next
          tar -xzf open-next.tar.gz -C .open-next

      - name: Package Lambda Function
        run: |
          echo "Zipping .open-next/server-functions/default as Lambda bundle..."
          rm -f server-function.zip
          cd .open-next/server-functions/default

          echo "Listing server bundle (for debugging):"
          ls

          zip -qr "$GITHUB_WORKSPACE/server-function.zip" .

      - name: Upload Lambda zip to S3
        run: |
          echo "Uploading Lambda zip to s3://$S3_BUCKET/$LAMBDA_S3_KEY"
          aws s3 cp "server-function.zip" "s3://$S3_BUCKET/$LAMBDA_S3_KEY" --region "$AWS_REGION"

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$S3_BUCKET" \
            --s3-key "$LAMBDA_S3_KEY" \
            --publish \
            --region "$AWS_REGION"

      - name: Wait for Lambda update to finish
        run: sleep 30

      - name: Update Lambda Environment
        run: |
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --environment "Variables={NEXT_PUBLIC_API_BASE='$NEXT_PUBLIC_API_BASE',NEXT_PUBLIC_SITE_URL='$NEXT_PUBLIC_SITE_URL',API_RATE_LIMIT_MAX='$API_RATE_LIMIT_MAX',API_RATE_LIMIT_WINDOW_MS='$API_RATE_LIMIT_WINDOW_MS',CSRF_COOKIE_NAME='$CSRF_COOKIE_NAME',AUTH_SESSION_COOKIE_NAME='$AUTH_SESSION_COOKIE_NAME',REDUX_DEVTOOLS_ENABLED='$REDUX_DEVTOOLS_ENABLED',JWT_SECRET='$JWT_SECRET'}" \
            --region "$AWS_REGION"

      - name: Sync static assets to S3
        run: |
          echo "Uploading .open-next/assets → s3://$S3_BUCKET ..."
          aws s3 sync ".open-next/assets" "s3://$S3_BUCKET" --delete --region "$AWS_REGION"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment to STAGING completed with status: ${{ job.status }}"
